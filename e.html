<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<style>
    body { font-family: sans-serif; padding: 20px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    button { cursor: pointer; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 3px 8px; border-radius: 4px; }
    .done-btn { background: #0ede8b; color: white; border: none; padding: 3px 8px; border-radius: 4px; }
    li.completed  { text-decoration: line-through; color: #888; }
  </style>
<body>
    <div>
        <h1>To Do List</h1>
        <input type="text" id="task" placeholder="Enter your task..." required>
        <button id="btn">Add</button>
        <ul id="list"></ul>
    </div>

    <script>
        const input = document.getElementById('task');
        const btn = document.getElementById('btn');
        const ul = document.getElementById('list');

        btn.addEventListener('click', async () => {
            let tasktext = input.value.trim();
            
            if (tasktext === '') {
                alert('Enter a valid task');
                return;
            }

            try {
                // 1. إرسال طلب POST لإضافة المهمة للسيرفر
                const response = await fetch('http://localhost:3000/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task: tasktext })
                });

                if (response.ok) {
                    const result = await response.json();

                    // 2. إنشاء عناصر القائمة بالشارشة
                    const li = document.createElement('li');
                    const deleteBtn = document.createElement('button');
                    const done = document.createElement('button')
                    done.classList = 'done-btn'
                    deleteBtn.classList = 'delete-btn'

                    li.textContent = tasktext + " ";
                    deleteBtn.textContent = 'delete';
                    done.textContent = 'Done';

                    // 3. ربط زر الحذف بطلب DELETE مستخدمين result.id القادم من السيرفر
                    deleteBtn.addEventListener('click', async () => {
                        try {
                            const deleteResponse = await fetch(`http://localhost:3000/api/tasks/${result.id}`, {
                                method: 'DELETE'
                            });

                            if (deleteResponse.ok) {
                                li.remove(); // حذف المهمة من الشاشة فور نجاح الحذف من السيرفر
                            } else {
                                alert('Failed to delete task from server');
                            }
                        } catch (err) {
                            console.log('Error deleting task:', err);
                        }
                    });
                    done.addEventListener('click',async()=>{
                        try {
                          const doneresponse = await fetch(`http://localhost:3000/api/tasks/${result.id}`, {
                                method: 'PUT'
                            }); 
                            if(doneresponse.ok) {
                                li.classList.toggle('completed')
                            }else {
                                alert('Failed to chek task from server');}
                            }catch(error){
                                console.log('Error doinig task:', error);
                            }
                })


                
                    li.appendChild(deleteBtn);
                    li.appendChild(done);
                    ul.appendChild(li);

                    // تفريغ مربع الإدخال
                    input.value = '';
                    
                     
                } else {
                    alert('Server error: Could not save task');
                }
                
            } catch (error) {
                console.log('There was an error:', error);
            }
        });
    </script>   
</body>
</html>
